[news-tldr-sync]
user = www-data
group = www-data

listen = /run/php/news-tldr-sync.sock
; The installer rewrites these two values to the active Nginx worker identity.
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 10s
pm.max_requests = 250

clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php

php_admin_value[memory_limit] = 32M
php_admin_value[max_execution_time] = 10
php_admin_value[post_max_size] = 256K
php_admin_value[upload_max_filesize] = 256K
php_admin_value[open_basedir] = /opt/news-tldr-sync:/var/lib/news-tldr-sync:/tmp
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
