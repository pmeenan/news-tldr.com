[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "news-tldr"
version = "0.1.0"
description = "Filesystem-backed RSS collection and summarization pipeline for news-tldr.com."
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0.11,<7",
  "httpx>=0.27,<1",
  "trafilatura>=1.9,<3",
  "beautifulsoup4>=4.12,<5",
  "h2>=4.3.0,<5",
]

[project.optional-dependencies]
dev = [
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.3.0,<1",
]

[project.scripts]
news-tldr-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "UP", "I", "W"]
